<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Phone Controller Bridge</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: #111;
        color: #eee;
      }

      h1 {
        margin-top: 0;
      }

      .settings {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .card {
        background: #1c1c1c;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 16px;
      }

      .card h2 {
        margin-top: 0;
        font-size: 18px;
      }

      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 10px 0;
      }

      .setting label {
        font-size: 14px;
      }

      input[type="number"] {
        width: 80px;
        padding: 6px 8px;
        border: 1px solid #444;
        border-radius: 5px;
        background: #111;
        color: #eee;
      }

      select {
        padding: 6px 8px;
        border: 1px solid #444;
        border-radius: 5px;
        background: #111;
        color: #eee;
      }

      #gamepads {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
      }

      .gamepad {
        background: #1c1c1c;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 16px;
      }

      .gamepad h2 {
        margin: 0 0 8px;
        font-size: 18px;
        word-break: break-word;
      }

      .status {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 5px;
        background: #252525;
        font-size: 12px;
        margin-bottom: 12px;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .button {
        padding: 8px 4px;
        text-align: center;
        border-radius: 5px;
        background: #252525;
        font-size: 12px;
      }

      .button.pressed {
        background: #eee;
        color: #111;
      }

      .axes {
        margin-top: 16px;
      }

      .axis {
        margin: 8px 0;
      }

      .axis-name {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 4px;
      }

      .axis-bar {
        height: 8px;
        background: #333;
        border-radius: 4px;
        overflow: hidden;
      }

      .axis-value {
        height: 100%;
        width: 0%;
        background: #eee;
        transition: width 0.05s linear;
      }

      .empty {
        padding: 30px;
        text-align: center;
        background: #1c1c1c;
        border: 1px solid #333;
        border-radius: 10px;
        color: #888;
      }
    </style>
  </head>

  <body>
    <h1>Phone Controller Bridge</h1>

    <div class="settings">
      <div class="card">
        <h2>Left Trigger</h2>

        <div class="setting">
          <label for="threshold_left">Threshold</label>
          <input
            id="threshold_left"
            type="number"
            min="0"
            max="100"
            value="0"
          />
        </div>
      </div>

      <div class="card">
        <h2>Right Trigger</h2>

        <div class="setting">
          <label for="threshold_right">Threshold</label>
          <input
            id="threshold_right"
            type="number"
            min="0"
            max="100"
            value="0"
          />
        </div>
      </div>

      <div class="card">
        <h2>Left Joystick</h2>

        <div class="setting">
          <label for="dead_zone_left">Dead Zone</label>
          <input
            id="dead_zone_left"
            type="number"
            min="0"
            max="100"
            value="0"
          />
        </div>

        <div class="setting">
          <label for="inverted_left_x">Invert X</label>
          <select id="inverted_left_x">
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </div>

        <div class="setting">
          <label for="inverted_left_y">Invert Y</label>
          <select id="inverted_left_y">
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </div>
      </div>

      <div class="card">
        <h2>Right Joystick</h2>

        <div class="setting">
          <label for="dead_zone_right">Dead Zone</label>
          <input
            id="dead_zone_right"
            type="number"
            min="0"
            max="100"
            value="0"
          />
        </div>

        <div class="setting">
          <label for="inverted_right_x">Invert X</label>
          <select id="inverted_right_x">
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </div>

        <div class="setting">
          <label for="inverted_right_y">Invert Y</label>
          <select id="inverted_right_y">
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </div>
      </div>
    </div>

    <div id="gamepads">
      <div class="empty">No gamepads connected</div>
    </div>

    <script defer>
      document.querySelectorAll('input[type="number"]').forEach((input) => {
        input.addEventListener("input", () => {
          const min = Number(input.min);
          const max = Number(input.max);
          const value = Number(input.value);

          input.value = Math.max(min, Math.min(max, value));
        });
      });
    </script>
    <script defer src="./static/script.js"></script>
  </body>
</html>
